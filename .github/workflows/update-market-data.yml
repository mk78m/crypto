name: Update Binance market data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Check Python
        run: python --version

      - name: Fetch and validate Binance Spot data
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          SYMBOLS = ["BTCUSDT", "ETHUSDT", "XRPUSDT", "BNBUSDT", "SOLUSDT",
                     "TRXUSDT", "DOGEUSDT", "ADAUSDT", "SUIUSDT"]
          BASES = ["https://data-api.binance.vision", "https://api-gcp.binance.com", "https://api.binance.com"]

          def get_json(path, params):
              last_error = None
              for base in BASES:
                  url = base + path + "?" + urlencode(params)
                  request = Request(
                      url,
                      headers={
                          "Accept": "application/json",
                          "User-Agent": "nabz-market-data/1.0",
                      },
                  )
                  try:
                      with urlopen(request, timeout=30) as response:
                          status = response.getcode()
                          body = response.read()
                      if not 200 <= status < 300:
                          raise RuntimeError(f"Unexpected HTTP status {status} for {url}: HTTP {status}")
                      try:
                          return json.loads(body)
                      except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                          raise RuntimeError(f"Malformed JSON from {url}") from exc
                  except (HTTPError, URLError, TimeoutError, RuntimeError) as exc:
                      last_error = exc
                      print(f"Binance endpoint failed: {url}: {exc}; trying next endpoint...")
              raise RuntimeError(f"Binance request failed on all endpoints: {last_error}")

          def number(value, label):
              try:
                  result = float(value)
              except (TypeError, ValueError) as exc:
                  raise RuntimeError(f"Invalid numeric {label}: {value!r}") from exc
              if not math.isfinite(result):
                  raise RuntimeError(f"Non-finite numeric {label}: {value!r}")
              return result

          data = {}
          for symbol in SYMBOLS:
              ticker = get_json("/api/v3/ticker/24hr", {"symbol": symbol})
              if not isinstance(ticker, dict) or ticker.get("symbol") != symbol:
                  raise RuntimeError(f"Malformed ticker response for {symbol}")
              ticker_fields = ("lastPrice", "priceChangePercent", "quoteVolume", "highPrice", "lowPrice")
              parsed_ticker = {key: number(ticker.get(key), f"{symbol}.{key}") for key in ticker_fields}

              rows = get_json("/api/v3/klines", {"symbol": symbol, "interval": "1h", "limit": 48})
              if not isinstance(rows, list) or not rows:
                  raise RuntimeError(f"Malformed/empty klines response for {symbol}")
              candles = []
              for index, row in enumerate(rows):
                  if not isinstance(row, list) or len(row) < 12:
                      raise RuntimeError(f"Malformed kline row {index} for {symbol}: expected at least 12 fields")
                  if isinstance(row[0], bool) or not isinstance(row[0], int) or isinstance(row[6], bool) or not isinstance(row[6], int):
                      raise RuntimeError(f"Malformed kline timestamps at row {index} for {symbol}")
                  candles.append({
                      "openTime": row[0],
                      "open": number(row[1], f"{symbol}.kline[{index}].open"),
                      "high": number(row[2], f"{symbol}.kline[{index}].high"),
                      "low": number(row[3], f"{symbol}.kline[{index}].low"),
                      "close": number(row[4], f"{symbol}.kline[{index}].close"),
                      "volume": number(row[5], f"{symbol}.kline[{index}].volume"),
                      "closeTime": row[6],
                      "quoteVolume": number(row[7], f"{symbol}.kline[{index}].quoteVolume"),
                      "trades": row[8],
                      "takerBuyBaseVolume": number(row[9], f"{symbol}.kline[{index}].takerBuyBaseVolume"),
                      "takerBuyQuoteVolume": number(row[10], f"{symbol}.kline[{index}].takerBuyQuoteVolume"),
                  })
              data[symbol] = {"ticker24h": parsed_ticker, "klines1h": candles}

          document = {
              "schema": "nabz.market-data.v1",
              "status": "available",
              "fetchedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "source": "Binance Spot REST API (https://data-api.binance.vision)",
              "symbols": SYMBOLS,
              "data": data,
          }
          output = Path("public/data/market-data.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(document, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          print(f"Wrote validated Binance data for {len(data)} symbols to {output}")
          PY
      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/market-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Binance market data"
            git push
          else
            echo "Market data is unchanged; nothing to commit."
          fi
